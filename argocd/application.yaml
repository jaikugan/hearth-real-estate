apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hearth-real-estate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jaikugan/hearth-real-estate.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: hearth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
