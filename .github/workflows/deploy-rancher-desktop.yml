name: Deploy to Rancher Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rancher-desktop-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, rancher-desktop]
    env:
      IMAGE: hearth-real-estate:${{ github.sha }}
      KUBE_CONTEXT: rancher-desktop
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Add Rancher Desktop tools to PATH
        run: echo "$HOME/.rd/bin" >> "$GITHUB_PATH"

      - name: Check JavaScript syntax
        run: node --check app.js

      # Fails the job if the quality gate fails (sonar.qualitygate.wait in sonar-project.properties).
      - name: SonarQube scan and quality gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Build image
        run: docker build -t "$IMAGE" .

      # Pin to a verified tag or digest; trivy images were tampered with in a 2026 supply-chain incident.
      - name: Trivy image scan
        env:
          TRIVY_IMAGE: aquasec/trivy:0.69.3
        run: |
          docker save "$IMAGE" -o "$RUNNER_TEMP/image.tar"
          # docker cp instead of a bind mount: Rancher Desktop's VM only shares $HOME.
          cid=$(docker create -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image --input /image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress)
          docker cp "$RUNNER_TEMP/image.tar" "$cid:/image.tar"
          rm -f "$RUNNER_TEMP/image.tar"
          rc=0
          docker start -a "$cid" || rc=$?
          docker rm "$cid" >/dev/null
          exit "$rc"

      - name: Deploy to Kubernetes
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|" k8s/deployment.yaml \
            | kubectl --context "$KUBE_CONTEXT" apply -f -

      - name: Wait for rollout
        run: kubectl --context "$KUBE_CONTEXT" -n hearth rollout status deployment/hearth-real-estate --timeout=120s

      - name: Show service
        run: kubectl --context "$KUBE_CONTEXT" -n hearth get service hearth-real-estate
