name: Deploy to Rancher Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rancher-desktop-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, rancher-desktop]
    env:
      IMAGE: hearth-real-estate:${{ github.sha }}
      KUBE_CONTEXT: rancher-desktop
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Add Rancher Desktop tools to PATH
        run: echo "$HOME/.rd/bin" >> "$GITHUB_PATH"

      - name: Check JavaScript syntax
        run: node --check app.js

      # Fails the job if the quality gate fails (sonar.qualitygate.wait in sonar-project.properties).
      - name: SonarQube scan and quality gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Build image
        run: docker build -t "$IMAGE" .

      # Pin to a verified tag or digest; trivy images were tampered with in a 2026 supply-chain incident.
      - name: Trivy image scan
        env:
          TRIVY_IMAGE: aquasec/trivy:0.69.3
        run: |
          docker save "$IMAGE" -o "$RUNNER_TEMP/image.tar"
          # docker cp instead of a bind mount: Rancher Desktop's VM only shares $HOME.
          cid=$(docker create -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image --input /image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress)
          docker cp "$RUNNER_TEMP/image.tar" "$cid:/image.tar"
          rm -f "$RUNNER_TEMP/image.tar"
          rc=0
          docker start -a "$cid" || rc=$?
          docker rm "$cid" >/dev/null
          exit "$rc"

      # Argo CD deploys what's in git, so publish the new tag there.
      - name: Commit image tag for Argo CD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          perl -pi -e "s/newTag: .*/newTag: $GITHUB_SHA/" k8s/kustomization.yaml
          if git diff --quiet; then echo "Tag already set"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "deploy: hearth-real-estate ${GITHUB_SHA::7} [skip ci]"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main

      - name: Ask Argo CD to refresh
        run: kubectl --context "$KUBE_CONTEXT" -n argocd annotate application hearth-real-estate argocd.argoproj.io/refresh=normal --overwrite

      - name: Wait for Argo CD rollout
        run: |
          for _ in $(seq 60); do
            current=$(kubectl --context "$KUBE_CONTEXT" -n hearth get deploy hearth-real-estate -o jsonpath='{.spec.template.spec.containers[0].image}')
            [ "$current" = "$IMAGE" ] && break
            sleep 5
          done
          [ "$current" = "$IMAGE" ] || { echo "Argo CD did not deploy $IMAGE (running: $current)"; exit 1; }
          kubectl --context "$KUBE_CONTEXT" -n hearth rollout status deployment/hearth-real-estate --timeout=120s

      - name: Show service
        run: kubectl --context "$KUBE_CONTEXT" -n hearth get service hearth-real-estate
